name: Validate Mothlight

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Audit interactive control wiring
        run: npm run audit:interactions
      - name: TypeScript and dead-code checks
        run: npm run typecheck
      - name: Complete regression suite
        run: npm run test:all

  website-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm install --no-audit --no-fund
      - name: Build Angular and Three.js website
        run: npm run build
