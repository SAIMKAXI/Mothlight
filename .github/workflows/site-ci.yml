name: Validate Mothlight website

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/site-ci.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

jobs:
  angular-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install dependencies
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Build Angular website
        working-directory: website
        run: npm run build -- --base-href "/Mothlight/"
