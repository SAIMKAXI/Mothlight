name: Deploy Mothlight website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mothlight-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Build Angular website
        working-directory: website
        run: npm run build -- --base-href "/Mothlight/"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        # GitHub Pages must be enabled once in repository Settings → Pages.
        # The Actions token cannot create the Pages site for this repository.
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist/mothlight-site/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
