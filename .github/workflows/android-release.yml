name: Android Test Release

on:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "babel.config.js"
      - "tsconfig.json"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mothlight-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build optimized Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37 toolchain
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo dependencies
        run: npx expo install --check

      - name: Verify Babel preset for release bundling
        run: node -e "require.resolve('babel-preset-expo'); console.log('babel-preset-expo is installed and resolvable')"

      - name: Verify SafeAreaProvider at app root
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const app = fs.readFileSync('App.tsx', 'utf8');
          if (!app.includes('SafeAreaProvider') || !app.includes('<AppContent />')) {
            throw new Error('App must wrap AppContent in SafeAreaProvider before useSafeAreaInsets runs.');
          }
          console.log('SafeAreaProvider root verified.');
          NODE

      - name: TypeScript checks
        run: npm run typecheck

      - name: Audit interactive control wiring
        run: npm run audit:interactions

      - name: Complete regression suite
        run: npm run test:all

      - name: Validate app version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPO_VERSION="$(node -p "require('./app.json').expo.version")"
          if [ "$PACKAGE_VERSION" != "$EXPO_VERSION" ]; then
            echo "Version mismatch: package.json=$PACKAGE_VERSION app.json=$EXPO_VERSION"
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$PACKAGE_VERSION" >/dev/null 2>&1; then
            echo "Release tag v$PACKAGE_VERSION already exists."
            exit 1
          fi

      - name: Generate Mothlight brand assets
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/generate_brand_assets.py
          python scripts/generate_typewriter_audio.py

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure stable Mothlight test signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MOTHLIGHT_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOTHLIGHT_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOTHLIGHT_TEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOTHLIGHT_TEST_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing MOTHLIGHT_TEST_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing MOTHLIGHT_TEST_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing MOTHLIGHT_TEST_KEY_ALIAS repository secret."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing MOTHLIGHT_TEST_KEY_PASSWORD repository secret."; exit 1; }
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/mothlight-test.keystore
          {
            echo "MYAPP_UPLOAD_STORE_FILE=mothlight-test.keystore"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Build optimized release APK (ARM64)
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true \
            --no-daemon --stacktrace

      - name: Verify and prepare downloadable APK
        shell: bash
        run: |
          mkdir -p dist
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "dist/Mothlight-v${{ steps.version.outputs.version }}-Android-ARM64.apk"
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mothlight-v${{ steps.version.outputs.version }}-Android-Release-ARM64
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Mothlight v${{ steps.version.outputs.version }} — Android Test Release
          prerelease: true
          make_latest: false
          files: dist/*.apk
          fail_on_unmatched_files: true
          body: |
            ## Mothlight Android test release

            This is an optimized **Release build variant** for direct sideload testing on **ARM64 Android devices**.

            - R8 code shrinking and optimization enabled.
            - Unused Android resources removed.
            - Emulator-only and 32-bit native ABIs excluded to reduce APK size.
            - Build verified with Android APK signature verification.

            **Signing:** This preview uses a stable, explicitly test-only signing certificate so future Mothlight preview APKs can install as updates. The public test key is not suitable for production or Google Play distribution. The first install after this signing change must replace older preview installs signed with the previous temporary CI key; uninstalling an older build removes its local app data, so export or otherwise back up important notes first.

            **Distribution:** Intended for tester sideloading, not Google Play production.
            Notes and settings remain stored locally on the device.
